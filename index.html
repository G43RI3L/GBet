<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Apostas - Futebol</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="container">
    <h1>Simulador de Apostas - 8 Jogos</h1>

    <form id="bet-form">
      <div id="games-container"></div>
      <label for="totalAmount">Valor total a apostar (R$):</label>
      <input type="number" id="totalAmount" step="0.01" value="10" required>
      <button type="submit">Simular apostas com esses jogos</button>
      <button type="button" id="resetar-apostas">Resetar Apostas</button>
      <button type="button" id="gerar-dois-erros">Gerar Combinações com 2 Erros</button>
    </form>

    <div id="results">
      <h2>Combinações Geradas</h2>
      <div id="opcoes-principais"></div>
    </div>

    <h2>Combinações com 2 Erros (1 removido, 1 invertido)</h2>
    <div id="opcoes-dois-erros"></div>

    <div id="acertos">
      <h2>Informe os resultados</h2>
      <div id="acertos-container"></div>
      <button id="calcular-lucro" type="button">Calcular Lucro</button>
      <div id="resumo-resultado"></div>
    </div>

    <div id="historico">
      <h2>Histórico de Resultados</h2>
      <ul id="historico-lista"></ul>
      <canvas id="graficoLucro" width="400" height="200"></canvas>
    </div>
  </div>
</body>
</html>
